name: Auto Extend PythonAnywhere Hosting

on:
  schedule:
    # Berjalan otomatis setiap tanggal 1 dan 15 setiap bulan jam 00:00 UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Mengizinkan pengujian manual melalui tombol "Run workflow" di GitHub

jobs:
  extend-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Extend PythonAnywhere Expiry Date
        run: |
          echo "=== Trying lowercase domain ==="
          RESPONSE=$(curl -s -o response1.txt -w "%{http_code}" -X POST \
            "https://www.pythonanywhere.com/api/v0/user/KampungSipias/webapps/kampungsipias.pythonanywhere.com/extend/" \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
          echo "HTTP Status: $RESPONSE"
          echo "Response body:" && cat response1.txt && echo ""

          if [ "$RESPONSE" != "200" ]; then
            echo "=== Trying mixed-case domain ==="
            RESPONSE2=$(curl -s -o response2.txt -w "%{http_code}" -X POST \
              "https://www.pythonanywhere.com/api/v0/user/KampungSipias/webapps/KampungSipias.pythonanywhere.com/extend/" \
              -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}")
            echo "HTTP Status: $RESPONSE2"
            echo "Response body:" && cat response2.txt && echo ""
          fi

          echo "=== Checking current webapp info ==="
          curl -s \
            "https://www.pythonanywhere.com/api/v0/user/KampungSipias/webapps/" \
            -H "Authorization: Token ${{ secrets.PA_API_TOKEN }}"
