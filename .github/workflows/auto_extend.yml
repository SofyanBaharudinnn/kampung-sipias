name: Auto Extend PythonAnywhere Hosting

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

jobs:
  extend-webapp:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Extend PythonAnywhere via Browser
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_PASSWORD: ${{ secrets.PA_PASSWORD }}
        run: |
          python3 << 'SCRIPT'
          import os
          from playwright.sync_api import sync_playwright

          username = os.environ['PA_USERNAME']
          password = os.environ['PA_PASSWORD']

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()

              # Step 1: Login
              print("=== Step 1: Opening login page ===")
              page.goto("https://www.pythonanywhere.com/login/")
              page.wait_for_load_state("networkidle")

              print("=== Step 2: Filling login form ===")
              page.fill('input[name="auth-username"]', username)
              page.fill('input[name="auth-password"]', password)
              page.click('button[type="submit"]')
              page.wait_for_load_state("networkidle")

              current_url = page.url
              print(f"After login URL: {current_url}")

              if "login" in current_url.lower():
                  print("ERROR: Login failed! Check PA_USERNAME and PA_PASSWORD secrets.")
                  browser.close()
                  exit(1)

              print("Login successful!")

              # Step 2: Go to Web tab
              print("=== Step 3: Navigating to Web tab ===")
              page.goto(f"https://www.pythonanywhere.com/user/{username}/webapps/")
              page.wait_for_load_state("networkidle")

              # Step 3: Click extend button
              print("=== Step 4: Looking for extend button ===")
              extend_button = page.locator('button:has-text("Run until"), input[value*="Run until"], a:has-text("Run until")')
              
              if extend_button.count() > 0:
                  print(f"Found extend button: {extend_button.first.text_content()}")
                  extend_button.first.click()
                  page.wait_for_load_state("networkidle")
                  print("SUCCESS! Clicked extend button!")

                  # Check new expiry
                  page.wait_for_timeout(2000)
                  content = page.content()
                  if "disabled on" in content:
                      import re
                      match = re.search(r'disabled on\s+<[^>]+>([^<]+)', content)
                      if not match:
                          match = re.search(r'disabled on\s+(.+?)[\n<]', content)
                      if match:
                          print(f"New expiry date: {match.group(1).strip()}")
              else:
                  print("Could not find extend button. Page content preview:")
                  print(page.content()[:2000])

              browser.close()
          SCRIPT
