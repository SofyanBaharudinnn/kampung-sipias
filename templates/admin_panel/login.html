<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin — Kampung Sipias</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --primary: #0D9488;
      --primary-dark: #0F766E;
      --accent: #2D6A4F;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #0A1628 0%, #0F2942 50%, #0D9488 100%);
      color: var(--text-dark);
    }

    .login-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(13, 148, 136, 0.15), rgba(45, 106, 79, 0.1));
      border: 1.5 solid rgba(13, 148, 136, 0.25);
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.15);
    }

    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .login-sub {
      font-size: 0.88rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--text-dark);
      outline: none;
      transition: all 0.2s ease;
      background: #F8FAFC;
    }

    .form-control:focus {
      border-color: var(--primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(13, 148, 136, 0.12);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0D9488, #0F766E);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(13, 148, 136, 0.3);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #0F766E, #115E59);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(13, 148, 136, 0.4);
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FCA5A5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="login-title">Panel Admin</h1>
        <p class="login-sub">Kampung Sipias · Distrik Elikobel</p>
      </div>

      {% if messages %}
        {% for message in messages %}
        <div class="alert"><i class="bi bi-exclamation-triangle-fill"></i> {{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Masukkan username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i> Masuk ke Panel Admin
        </button>
      </form>

      <a href="/" class="back-link">
        <i class="bi bi-arrow-left"></i> Kembali ke Website
      </a>
    </div>
  </div>
</body>
</html>
